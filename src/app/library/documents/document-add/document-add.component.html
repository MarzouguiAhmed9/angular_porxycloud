<div class="row">
  <div class="col-sm-12">
    <app-card cardTitle="Add Document" [options]="false">
      <hr />
      <form [formGroup]="documentForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6">
            <div class="form-group">
              <label for="title">Document Title</label>
              <input type="text" id="title" formControlName="title" class="form-control" 
                     [ngClass]="{ 'is-invalid': f['title'].touched && f['title'].errors }" />
              <div *ngIf="f['title'].touched && f['title'].errors" class="invalid-feedback">
                <div *ngIf="f['title'].errors['required']">Title is required</div>
                <div *ngIf="f['title'].errors['minlength']">Title must be at least 3 characters</div>
              </div>
            </div>

            <div class="form-group">
              <label for="description">Description</label>
              <textarea id="description" formControlName="description" class="form-control"
                        [ngClass]="{ 'is-invalid': f['description'].touched && f['description'].errors }"></textarea>
              <div *ngIf="f['description'].touched && f['description'].errors" class="invalid-feedback">
                <div *ngIf="f['description'].errors['required']">Description is required</div>
                <div *ngIf="f['description'].errors['minlength']">Description must be at least 10 characters</div>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-group">
              <label for="keywords">Keywords</label>
              <input type="text" id="keywords" formControlName="keywords" class="form-control"
                     [ngClass]="{ 'is-invalid': f['keywords'].touched && f['keywords'].errors }" />
              <div *ngIf="f['keywords'].touched && f['keywords'].errors" class="invalid-feedback">
                <div *ngIf="f['keywords'].errors['required']">Keywords are required</div>
                <div *ngIf="f['keywords'].errors['minlength']">Keywords must be at least 3 characters</div>
              </div>
            </div>

            <div class="form-group">
              <label for="documentType">Document Type</label>
              <select class="form-control" id="documentType" formControlName="documentType"
                      [ngClass]="{ 'is-invalid': f['documentType'].touched && f['documentType'].errors }">
                <option value="">Select a type</option>
                <option *ngFor="let type of documentTypes" [value]="type">{{ type }}</option>
              </select>
              <div *ngIf="f['documentType'].touched && f['documentType'].errors" class="invalid-feedback">
                <div *ngIf="f['documentType'].errors['required']">Document type is required</div>
              </div>
            </div>

            <div class="form-group">
              <label for="status">Status</label>
              <select class="form-control" id="status" formControlName="status"
                      [ngClass]="{ 'is-invalid': f['status'].touched && f['status'].errors }">
                <option *ngFor="let status of documentStatuses" [value]="status">{{ status }}</option>
              </select>
              <div *ngIf="f['status'].touched && f['status'].errors" class="invalid-feedback">
                <div *ngIf="f['status'].errors['required']">Status is required</div>
              </div>
            </div>

            <div class="form-group">
              <label for="file">File Upload</label>
              <input type="file" id="file" (change)="onFileSelected($event)" class="form-control"
                     [ngClass]="{ 'is-invalid': f['file'].touched && f['file'].errors }" />
              <div *ngIf="f['file'].touched && f['file'].errors" class="invalid-feedback">
                <div *ngIf="f['file'].errors['required']">File is required</div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="documentForm.invalid">
          Submit
        </button>
      </form>
    </app-card>
  </div>
</div>
