<div class="row">
    <div class="col-sm-12">
      <app-card cardTitle="Add Department" [options]="false">
        <hr />
        <form [formGroup]="departmentForm" (ngSubmit)="addDepartment()">
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="name">Department Name</label>
                <input type="text" id="name" formControlName="name" class="form-control" placeholder="Enter department name" required />
              </div>
              <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" formControlName="description" class="form-control" placeholder="Enter department description"></textarea>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" [disabled]="departmentForm.invalid">Add Department</button>
        </form>
      </app-card>
    </div>
  </div>
  
  <div class="col-xl-12 mt-4">
    <app-card cardTitle="Manage Departments" [options]="false" blockClass="table-border-style">
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let dep of departments; let i = index">
              <th scope="row">{{ i + 1 }}</th>
              <td>{{ dep.name }}</td>
              <td>{{ dep.description }}</td>
              <td>
                <button class="btn btn-sm btn-warning" (click)="onEdit(dep)">Edit</button>
                <button class="btn btn-sm btn-danger" (click)="deleteDepartment(dep.idDepartment)">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
