<app-card cardTitle="Cours Form" [options]="false">

    <ul class="pagination">
        <li class="page-item">
          <a class="page-link" href="javascript:" [routerLink]="['/cours/cours']" >Previous</a>
        </li>
        
      </ul>

    <h5 class="mt-5">Update Cours</h5>
    <hr />
    <form [formGroup]="formR"   >
      
      <div class="form-group">
        <label for="titre">Titre</label>
        <input type="text" class="form-control" id="titre" formControlName="titre" placeholder="Entrer le titre du cours" />
      </div>
  
      <div class="row">
        <div class="form-group col-md-6">
          <label for="auteur">Auteur</label>
          <input type="text" class="form-control" id="auteur" formControlName="auteur" placeholder="Abdallah Saidane" />
        </div>
        <div class="form-group col-md-6">
          <label for="categorie">Categorie</label>
          <input type="text" class="form-control" id="categorie" formControlName="categorie" placeholder="Angular , Spring , etc." />
        </div>
        <div class="form-group col-md-6">
            <label for="description">Description</label>
            <input type="text" class="form-control" id="description" formControlName="description" placeholder="Enter une description" />
        </div>
        <div class="form-group col-md-6">
            <label for="niveau">Niveau</label>
            <input type="text" class="form-control" id="niveau" formControlName="niveau" placeholder="DEBUTANT, INTERMEDIAIRE, AVANCE" />
        </div>
        <div class="form-group col-md-6">
            <label for="prix">Prix</label>
                <div class="input-group mb-3">
                  <span class="input-group-text">$</span>
                  <span class="input-group-text">0.00</span>
                  <input type="number" class="form-control" id="prix" formControlName="prix" placeholder="Entrer le prix" aria-label="Dollar amount (with dot and two decimal places)" />
                </div>
          </div>
          
          <div class="form-group col-md-6">
            <label for="langue">Langue</label>
            <input type="text" class="form-control" id="langue" formControlName="langue" placeholder="Enter la langue" />
          </div>
      </div>
  
      <div class="form-group">
        <label for="duree">Duree </label>
        <input type="number" class="form-control" id="duree" formControlName="duree" placeholder="Entrer la duree du cours" />
      </div>

      <div class="input-group mb-3">
        <div class="input-group mb-3">
            <label for="image" class="input-group-text">Image</label>
            <input type="file" class="form-control" id="image" (change)="onFileSelected($event,'image')" />
          </div>
      </div>

      <div class="input-group mb-3">
        <div class="input-group mb-3">
            <label for="document" class="input-group-text">Document Pdf</label>
            <input type="file" class="form-control" id="pdf" (change)="onFileSelected($event, 'document')" accept=".pdf"/>
          </div>
      </div>
  
      <button type="submit" (click)="update()" class="btn btn-primary mt-3">Update Cours </button>
    </form>
  </app-card>
