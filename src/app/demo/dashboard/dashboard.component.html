

 

<div class="container py-5 text-center" *ngIf="statistics">
  <h2 class="mb-4 fw-bold text-primary">User Statistics</h2>
  <div class="row justify-content-center gap-4">
    <div class="col-md-3 circle-container">
      <div class="circle">
        <svg width="120" height="120">
          <circle cx="60" cy="60" r="50" stroke="#4e54c8" stroke-width="12" fill="none" stroke-dasharray="314" stroke-dashoffset="94"></circle>
          <circle cx="60" cy="60" r="50" stroke="#00c6ff" stroke-width="6" fill="none" stroke-dasharray="314" stroke-dashoffset="157"></circle>
        </svg>
        <div class="circle-value">{{ statistics.totalUsers }}</div>
      </div>
      <div class="label mt-2 fw-semibold">Total Users</div>
    </div>

    <div class="col-md-3 circle-container">
      <div class="circle">
        <svg width="120" height="120">
          <circle cx="60" cy="60" r="50" stroke="#4e54c8" stroke-width="12" fill="none" stroke-dasharray="314" stroke-dashoffset="125"></circle>
          <circle cx="60" cy="60" r="50" stroke="#00c6ff" stroke-width="6" fill="none" stroke-dasharray="314" stroke-dashoffset="157"></circle>
        </svg>
        <div class="circle-value">{{ statistics.approvedUsers }}</div>
      </div>
      <div class="label mt-2 fw-semibold">Approved</div>
    </div>

    <div class="col-md-3 circle-container">
      <div class="circle">
        <svg width="120" height="120">
          <circle cx="60" cy="60" r="50" stroke="#4e54c8" stroke-width="12" fill="none" stroke-dasharray="314" stroke-dashoffset="180"></circle>
          <circle cx="60" cy="60" r="50" stroke="#00c6ff" stroke-width="6" fill="none" stroke-dasharray="314" stroke-dashoffset="157"></circle>
        </svg>
        <div class="circle-value">{{ statistics.nonApprovedUsers }}</div>
      </div>
      <div class="label mt-2 fw-semibold">Not Approved</div>
    </div>
  </div>
</div>
