<div class="col-xl-12">
    <app-card cardTitle="University List" [options]="false" blockClass="table-border-style">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>City</th>
              <th>Country</th>
              <th>Ranking</th>
              <th>Website</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let university of universities; let i = index">
              <th scope="row">{{ i + 1 }}</th>
              <td>{{ university.name }}</td>
              <td>{{ university.city }}</td>
              <td>{{ university.country }}</td>
              <td>{{ university.ranking }}</td>
              <td>
                <a [href]="university.website" target="_blank">{{ university.website }}</a>
              </td>
              <td>
                <!-- <button class="btn btn-sm btn-primary" (click)="editUniversity(university)">Edit</button> -->
                <!-- <button class="btn btn-sm btn-danger" (click)="deleteUniversity(university.universityId)">Delete</button> -->
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </app-card>
  </div>
