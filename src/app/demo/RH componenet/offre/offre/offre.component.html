<div class="dashboard-container">
  <!-- Add New Offre Button -->
  <div class="mb-3">
    <button class="btn btn-success" (click)="addOffre()">Add Offre</button>
  </div>

  <!-- Form to add or view an "Offre" -->
  <div class="offer-form card p-4">
    <h2 class="text-center">{{ isEditing ? 'Add Offre' : 'View Offre' }}</h2>
    <form (ngSubmit)="onSubmit()" enctype="multipart/form-data">

      <!-- Title Input -->
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          [(ngModel)]="offre.title"
          name="title"
          required
          class="form-control"
          placeholder="Enter job title"
          [readonly]="!isEditing" />
      </div>

      <!-- Skills Input -->
      <div class="form-group">
        <label for="skills">Skills</label>
        <input
          type="text"
          id="skills"
          [(ngModel)]="offre.skills"
          name="skills"
          required
          class="form-control"
          placeholder="Enter required skills"
          [readonly]="!isEditing" />
      </div>

      <!-- Description Input -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          [(ngModel)]="offre.description"
          name="description"
          required
          class="form-control"
          placeholder="Enter job description"
          [readonly]="!isEditing"></textarea>
      </div>

      <!-- Image Upload (always visible) -->
      <div class="form-group">
        <label for="image">Image</label>
        <input
          type="file"
          id="image"
          (change)="onFileChange($event)"
          class="form-control"
          [disabled]="!isEditing" />
      </div>

      <!-- Submit Button -->
      <button *ngIf="isEditing" type="submit" class="btn btn-primary btn-block">Submit</button>
    </form>
  </div>

  <!-- Spacer between form and table -->
  <div class="spacer my-4"></div>

  <!-- Offres List Table -->
  <div>
    <h2 class="text-center">Offres List</h2>
    <table class="table table-striped table-bordered table-responsive">
      <thead>
      <tr>
        <th>Title</th>
        <th>Skills</th>
        <th>Description</th>
        <th>Image</th> <!-- New column for Image -->
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let offree of applications">
        <td>{{ offree.title }}</td>
        <td>{{ offree.skills }}</td>
        <td>{{ offree.description }}</td>
        <td>
          <!-- Display the image if the image URL exists -->
          <img *ngIf="offree.imageUrl" [src]="'http://localhost:8089/Projetback/' + offree.imageUrl" alt="Offer Image" class="offer-image" [style.width.px]="100" [style.height.px]="100">
          <span *ngIf="!offree.imageUrl">No Image</span>
        </td>
        <td>
          <!-- View, Edit, and Delete buttons with icons -->
          <div class="btn-group" role="group">
            <button class="btn btn-success" (click)="viewOffre(offree)">
              <i class="fas fa-eye"></i> View
            </button>
            <button class="btn btn-info" (click)="editOffre(offree)">
              <i class="fas fa-edit"></i> Edit
            </button>
            <button class="btn btn-danger" (click)="deleteOffre(offree.id)">
              <i class="fas fa-trash-alt"></i> Delete
            </button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
