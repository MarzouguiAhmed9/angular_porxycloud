<div class="user-table-container">
  <div class="header-bar">
    <h2>User List</h2>
    <div class="actions-bar">
      <input
        type="text"
        placeholder="Search by name..."
        [(ngModel)]="searchTerm"
        (input)="filterUserss()"
      />

      <select [(ngModel)]="selectedStatus" (change)="filterUserss()">
        <option value="">All Status</option>
        <option value="true">Approved</option>
        <option value="false">Not Approved</option>
      </select>

      <button class="add-button" (click)="addUser()">
        <span>+</span> Add User
      </button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="user-table">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Date of Birth</th>
          <th>Address</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>{{ user.firstName }}</td>
          <td>{{ user.lastName }}</td>
          <td>{{ user.birthday }}</td>
          <td>{{ user.address }}</td>
          <td>{{ user.phone }}</td>
          
          <td>
            <span [ngClass]="{'text-success': user.approuve, 'text-danger': !user.approuve}">
              {{ user.approuve ? 'Approved' : 'Not Approved' }}
            </span>
          </td>
          <td class="actions">
            <button class="btn edit" (click)="updateUser(user)">Edit</button>
            <button class="btn delete" (click)="deleteUser(user.id)">Delete</button>
            <button class="btn toggle" (click)="toggleApproval(user.id)">
              {{ user.approuve ? 'Disapprove' : 'Approve' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
