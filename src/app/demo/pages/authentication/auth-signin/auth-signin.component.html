<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card">
      <div class="card-body text-center">
        <div class="mb-4">
          <i class="feather icon-unlock auth-icon"></i>
        </div>
        <h3 class="mb-4">Login</h3>
        <form (submit)="login()">
          <div class="form-group">
            <input type="text" [(ngModel)]="username" name="username" class="form-control" id="username" placeholder="Username" required />
          </div>

          <div class="form-group mt-3">
            <input type="password" [(ngModel)]="password" name="password" class="form-control" id="password" placeholder="Password" required />
          </div>

          <div class="form-group mt-4 text-center">
            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
          </div>
        </form>
        <p class="mb-2 text-muted">
          Forgot password?
          <a [routerLink]="['/auth/forgot']">Reset</a>
        </p>
        <p class="mb-0 text-muted">
          Don’t have an account?
          <a [routerLink]="['/auth/signup']">Sign up</a>
        </p>
      </div>
    </div>
  </div>
</div>
