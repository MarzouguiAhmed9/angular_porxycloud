<p>addsponsors works!</p>
<div class="container mt-4">
    <h2 class="mb-4">Add Sponsor</h2>
    
    <form [formGroup]="sponsorForm" (ngSubmit)="addSponsor()">
      <!-- Nom du sponsor -->
      <div class="mb-3">
        <label for="nomSponsor" class="form-label">Sponsor Name</label>
        <input type="text" id="nomSponsor" class="form-control" formControlName="nomSponsor">
        <div *ngIf="nomSponsor?.invalid && nomSponsor?.touched" class="text-danger">
          <div *ngIf="nomSponsor?.errors?.['required']">Le nom du sponsor est requis.</div>
          <div *ngIf="nomSponsor?.errors?.['minlength']">
            Le nom doit comporter au moins 3 caractères.
          </div>
        </div>
      </div>
  
      <!-- Description du sponsor -->
      <div class="mb-3">
        <label for="descriptionSponsor" class="form-label">Description</label>
        <textarea id="descriptionSponsor" class="form-control" formControlName="descriptionSponsor"></textarea>
        <div *ngIf="descriptionSponsor?.invalid && descriptionSponsor?.touched" class="text-danger">
          <div *ngIf="descriptionSponsor?.errors?.['required']">La description est requise.</div>
          <div *ngIf="descriptionSponsor?.errors?.['maxlength']">
            La description ne doit pas dépasser 500 caractères.
          </div>
        </div>
      </div>
  
      <!-- Contact (email) -->
      <div class="mb-3">
        <label for="contact" class="form-label">Email</label>
        <input type="email" id="contact" class="form-control" formControlName="contact">
        <div *ngIf="contact?.invalid && contact?.touched" class="text-danger">
          <div *ngIf="contact?.errors?.['required']">L'email est requis.</div>
          <div *ngIf="contact?.errors?.['email']">
            Veuillez entrer une adresse email valide.
          </div>
        </div>
      </div>
  
      
  
      <!-- Logo -->
      <div class="mb-3">
        <label for="logo" class="form-label">Logo</label>
        <input type="file" id="logo" class="form-control" 
               (change)="onFileSelected($event)" accept="image/*">
      </div>
  
      <!-- Bouton de soumission -->
      <button type="submit" class="btn btn-primary" [disabled]="sponsorForm.invalid">Add Sponsor</button>
    </form>
  </div>
