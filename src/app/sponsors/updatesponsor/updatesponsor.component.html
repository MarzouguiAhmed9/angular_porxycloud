<p>updatesponsor works!</p>
<div class="container mt-4">
    <h2 class="mb-4">Modifier le sponsor</h2>
    
    <form [formGroup]="sponsorForm" (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
      <!-- Nom du sponsor -->
      <div class="mb-3">
        <label for="nomSponsor" class="form-label">Nom du sponsor *</label>
        <input type="text" class="form-control" id="nomSponsor" 
               formControlName="nomSponsor"
               [ngClass]="{'is-invalid': nomSponsor?.invalid && nomSponsor?.touched}">
        <div class="invalid-feedback">
          <span *ngIf="nomSponsor?.hasError('required')">Ce champ est obligatoire</span>
          <span *ngIf="nomSponsor?.hasError('minlength')">Minimum 3 caractères</span>
        </div>
      </div>
  
      <!-- Description -->
      <div class="mb-3">
        <label for="descriptionSponsor" class="form-label">Description *</label>
        <textarea class="form-control" id="descriptionSponsor" rows="3"
                  formControlName="descriptionSponsor"
                  [ngClass]="{'is-invalid': descriptionSponsor?.invalid && descriptionSponsor?.touched}"></textarea>
        <div class="invalid-feedback">
          <span *ngIf="descriptionSponsor?.hasError('required')">Ce champ est obligatoire</span>
          <span *ngIf="descriptionSponsor?.hasError('maxlength')">Maximum 500 caractères</span>
        </div>
      </div>
  
      <!-- Contact (Email) -->
      <div class="mb-3">
        <label for="contact" class="form-label">Email *</label>
        <input type="email" class="form-control" id="contact"
               formControlName="contact"
               [ngClass]="{'is-invalid': contact?.invalid && contact?.touched}">
        <div class="invalid-feedback">
          <span *ngIf="contact?.hasError('required')">Ce champ est obligatoire</span>
          <span *ngIf="contact?.hasError('email')">Veuillez entrer un email valide</span>
        </div>
      </div>
  
      
  
      <!-- Logo -->
      <div class="mb-3">
        <label for="logo" class="form-label">Logo</label>
        <input type="file" id="logo" class="form-control" 
               (change)="onFileSelected($event)" accept="image/*">
        
        <div *ngIf="imagePreview" class="mt-2">
          <img [src]="imagePreview" alt="Preview" style="max-height: 200px;" class="img-thumbnail">
        </div>
        <div *ngIf="currentSponsor?.logo && !imagePreview" class="mt-2">
          <p>Logo actuel:</p>
          <img [src]="'http://localhost:8081/gestionEvent/uploads/' + currentSponsor.logo" 
               alt="Current logo" style="max-height: 200px;" class="img-thumbnail">
        </div>
      </div>
  
      <!-- Boutons -->
      <button type="submit" class="btn btn-primary" [disabled]="sponsorForm.invalid">
        Enregistrer
      </button>
